name: ci

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Smoke built CLI help
        run: node dist/cli.js --help

      - name: Pack installable tarball
        run: npm pack

      - name: Smoke install tarball in a fresh temp project
        run: |
          TARBALL="$(ls agent-instruction-lint-*.tgz)"
          TMPDIR="$(mktemp -d)"
          cd "$TMPDIR"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          ./node_modules/.bin/agent-instruction-lint --help
